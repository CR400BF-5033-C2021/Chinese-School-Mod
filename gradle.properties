# Gradle 运行参数
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 环境版本
# 最新版本可在 https://projects.neoforged.net/neoforged/neoforge 查看
# Minecraft 版本必须与 NeoForge 版本对应，否则无法解析到有效依赖
minecraft_version=26.3
minecraft_version_range=[26.3]
# NeoForge 版本同样必须与 Minecraft 版本对应
neo_version=26.3.0.76

# 模组信息
# 唯一标识符，必须为小写英文，需与主类 @Mod 注解中的常量一致
mod_id=chinese_school
# 显示名称
mod_name=Chinese School Mod
# 许可证，参见 https://choosealicense.com/
mod_license=MIT
# 模组版本，遵循 https://semver.org/
mod_version=0.1.0
# 组 ID，仅用于发布到 Maven 仓库时使用；应与源码包名一致
mod_group_id=com.cr400bf5033.chineseschool
# 作者
mod_authors=CR400BF-5033-C2021
